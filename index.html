<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="收藏柜">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.json">
<title>Kitty 收藏柜</title>
<style>
:root{
  --pink:#ef5fa7; --pink-soft:#fde8f2; --pink-weak:#fff5fa;
  --red:#e5484d; --green:#2f9e6b;
  --bg:#ffffff; --bg2:#f4f4f7; --line:#ececf0;
  --text:#1f1f24; --sub:#8e8e96; --chip:#ececf0;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ---------- layout ---------- */
#main{padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b));max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-end;padding:6px 0 calc(6px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub)}
.tab.on{color:var(--pink)}
.fab-wrap{flex:1;display:flex;justify-content:center}
.fab{width:60px;height:60px;border-radius:50%;background:var(--pink);color:#fff;margin-top:-30px;
  box-shadow:0 0 0 6px #fff,0 8px 22px rgba(239,95,167,.35);display:flex;align-items:center;justify-content:center}

/* ---------- cabinet ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.head h1{font-size:30px;margin:0;font-weight:800;letter-spacing:.5px}
.head p{margin:4px 0 0;color:var(--sub);font-size:13px}
.head-btns{display:flex;gap:8px;align-items:center;flex-shrink:0}
.circle{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.toggle{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.toggle button{width:36px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8e8e96}
.toggle button.on{background:#fff;color:var(--pink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;height:40px;outline:none}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;height:40px;border-radius:11px;font-size:16px;color:var(--sub);font-weight:600}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg small{font-weight:400;font-size:12px;margin-left:3px;color:var(--sub)}
.cats{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:10px 2px 0;margin:0 -16px;padding-left:18px;padding-right:18px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex-shrink:0;font-size:16px;color:#55555c;padding-bottom:9px;border-bottom:3px solid transparent}
.cats button.on{color:var(--pink);border-color:var(--pink);font-weight:600}
.filters{display:flex;gap:10px;margin:12px 0 4px}
.pick{flex:1;position:relative;height:44px;background:var(--bg2);border-radius:12px;color:var(--pink);font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.pick select{position:absolute;inset:0;opacity:0;width:100%}
.pick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}

.card{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.thumb{width:92px;height:92px;border-radius:12px;background:var(--bg2) center/cover no-repeat;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#c4c4cc}
.card .body{flex:1;min-width:0}
.card h3{margin:0 0 6px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--chip);color:#55555c}
.chip.p{background:var(--pink);color:#fff}
.chip.s{background:var(--pink-soft);color:var(--pink)}
.meta{font-size:13px;color:#55555c;display:flex;flex-wrap:wrap;gap:2px 12px}
.meta .sold{color:var(--green)}
.actions{display:flex;flex-direction:column;gap:18px;align-self:stretch;justify-content:center}
.actions button{color:var(--pink);padding:4px}
.actions button.del{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.gcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);text-align:left}
.gcard .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:0}
.gcard .gb{padding:8px 10px 10px}
.gcard h3{margin:0 0 3px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .meta{font-size:12px}
.vlist{position:relative}
.vlist.g{margin-top:12px}
.vrow{position:absolute;left:0;right:0}
.vrow.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{height:121px}
.card .chips{flex-wrap:nowrap;overflow:hidden}
.card .meta,.gcard .meta{flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.gcard .gb{height:62px;overflow:hidden}
.thumb{background-color:var(--bg2)}
.empty{text-align:center;color:var(--sub);padding:70px 0;font-size:15px}
.empty svg{margin:0 auto 14px;color:#cfcfd6}

/* ---------- ledger ---------- */
.month{display:flex;align-items:center;justify-content:center;gap:22px;margin:2px 0 18px}
.month .mbtn{position:relative;background:var(--bg2);border-radius:22px;height:44px;padding:0 20px;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.month .mbtn input{position:absolute;inset:0;opacity:0;width:100%}
.month .arrow{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.sum{display:flex;background:var(--pink-weak);border-radius:18px;padding:18px 8px}
.sum>div{flex:1;text-align:center}
.sum>div+div{border-left:1px solid #f2d5e3}
.totbtn{display:flex;align-items:center;gap:4px;margin:8px auto 0;font-size:13px;color:var(--sub);padding:4px 10px}
.totbtn span.up{transform:rotate(180deg)}
.sum.total{margin-top:4px;background:var(--bg2);padding:14px 8px}
.sum.total .v{font-size:20px}
.sum.total>div+div{border-color:#e2e2e8}
.sum label{font-size:13px;color:var(--sub)}
.sum .v{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.sum .v small{font-size:15px}
.sum .v.in{color:var(--red)}
.sum .v .x{display:block;font-size:13px;font-weight:600}
.lchips{display:flex;gap:10px;margin:14px 0 6px}
.lchips button{flex:1;height:38px;border-radius:19px;background:var(--bg2);color:#6b6b73;font-size:15px}
.lchips button.on{background:var(--pink-soft);color:var(--pink);font-weight:600}
.day{font-size:13px;color:var(--sub);margin:16px 0 2px;display:flex;justify-content:space-between}
.entry{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.entry .thumb{width:46px;height:46px;border-radius:10px}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm span{font-size:12px;color:var(--sub)}
.entry .amt{font-size:17px;font-weight:600;white-space:nowrap}
.entry .amt.in{color:var(--red)}

/* ---------- editor ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg2);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .28s ease}
.sheet.open{transform:none}
.ebar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--safe-t) + 10px) 16px 10px;background:rgba(244,244,247,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ebar h2{margin:0;font-size:17px;font-weight:600}
.ebar .circle{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.save{background:var(--pink);color:#fff;border-radius:20px;height:36px;padding:0 18px;font-weight:600}
.ebody{max-width:640px;margin:0 auto;padding:4px 16px calc(40px + var(--safe-b))}
.photos{display:flex;gap:10px;overflow-x:auto;padding:6px 0 16px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.ph{position:relative;width:150px;height:150px;flex-shrink:0;border-radius:14px;background:#fff center/cover no-repeat}
.ph .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
  display:flex;align-items:center;justify-content:center}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pink);
  border:2px dashed #f3b6d4;background:#fff;font-size:14px}
.group{background:#fff;border-radius:18px;padding:0 16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.row>label{font-size:16px;flex-shrink:0;min-width:70px}
.row .val{flex:1;min-width:0;display:flex;justify-content:flex-end}
.row input,.row select{border:0;outline:none;background:transparent;text-align:right;width:100%;min-width:0;color:#3a3a40;height:44px}
.row input::placeholder{color:#b6b6be}
.row select{text-align-last:right;-webkit-appearance:none;appearance:none}
.row input[type=date]{-webkit-appearance:none;appearance:none;display:flex;justify-content:flex-end}
.row input[type=date]::-webkit-date-and-time-value{text-align:right}
.mini-seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
.mini-seg button{padding:0 12px;height:30px;border-radius:8px;font-size:14px;color:var(--sub)}
.mini-seg button.on{background:var(--pink);color:#fff;font-weight:600}
.tagrow{display:block;padding:12px 0}
.tagrow .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tagbox{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:14px;padding:5px 10px;border-radius:14px;background:var(--bg2);color:#55555c;display:flex;align-items:center;gap:4px}
.tag.on{background:var(--pink);color:#fff}
.tag.rm{background:#fff;border:1px dashed var(--red);color:var(--red)}
.tagrow .top .tedit{margin-left:auto;font-size:14px;color:var(--pink);padding:4px 2px}
.tmrow .tn small.hid{color:var(--red)}
.tmrow button.show{width:auto;padding:0 10px;color:var(--pink);font-size:14px}
.tagadd{display:flex;gap:8px;margin-top:10px}
.tagadd input{flex:1;height:38px;border-radius:10px;border:0;background:var(--bg2);padding:0 12px;outline:none}
.tagadd button{height:38px;padding:0 14px;border-radius:10px;background:var(--pink-soft);color:var(--pink);font-weight:600}
.note{width:100%;min-height:90px;border:0;outline:none;resize:vertical;padding:12px 0;background:transparent}
.dangerbtn{width:100%;height:50px;border-radius:14px;background:#fff;color:var(--red);font-size:16px;font-weight:600}

/* ---------- settings / toast ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 14px;color:var(--sub);font-size:13px;line-height:1.5}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mbtns button{height:48px;border-radius:12px;background:var(--bg2);font-size:16px}
.mbtns button.pk{background:var(--pink);color:#fff;font-weight:600}
.modal textarea{width:100%;min-height:70px;border-radius:12px;border:0;background:var(--bg2);padding:10px 12px;outline:none;margin-bottom:10px}
.tmlist{max-height:55vh;overflow-y:auto;margin:0 -4px 12px;padding:0 4px}
.tmrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg2);background:#fff;transition:transform .18s}
.tmrow.drag{transition:none;position:relative;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.15);border-radius:12px}
.tmrow .grip{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--sub);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.tmrow .tn{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmrow .tn small{color:var(--sub);font-size:12px;margin-left:6px}
.tmrow button{width:38px;height:38px;border-radius:10px;background:var(--bg2);font-size:16px;display:flex;align-items:center;justify-content:center}
.tmrow button:disabled{opacity:.3}
.tmrow button.del{width:auto;padding:0 12px;color:var(--red);font-size:14px}
.tmempty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);background:rgba(30,30,34,.88);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="main"></div>

<nav class="tabbar">
  <button class="tab" data-tab="cabinet" id="tab-cabinet">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    收藏柜
  </button>
  <div class="fab-wrap"><button class="fab" id="fab" aria-label="添加">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button></div>
  <button class="tab" data-tab="ledger" id="tab-ledger">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M2 5.5C4.5 4 8 4 11 5.5v14C8 18 4.5 18 2 19.5z"/><path d="M22 5.5C19.5 4 16 4 13 5.5v14c3-1.5 6.5-1.5 9 0z"/></svg>
    账本
  </button>
</nav>

<div class="sheet" id="sheet"></div>
<input type="file" id="filePhoto" accept="image/*" multiple class="hidden">
<input type="file" id="fileImport" accept="application/json,.json" class="hidden">
<div id="toast"></div>

<script>
/* ================= storage (IndexedDB) =================
   items  : item records (no image data, only photoIds)
   photos : photoId -> {type, buf}   full-size photo (≤1280px)
   thumbs : itemId  -> {type, buf}   small thumbnail of first photo (≤360px)
   Binary data is stored as ArrayBuffer (most compatible with iOS Safari). */
const DB = (() => {
  let dbp;
  function open(){
    if(!dbp) dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('kitty-ledger',2);
      r.onupgradeneeded = () => {
        const db = r.result;
        for (const [n,o] of [['items',{keyPath:'id'}],['meta'],['photos'],['thumbs']])
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n,o);
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(stores, mode, fn){
    const db = await open();
    return new Promise((res,rej)=>{
      const t = db.transaction(stores, mode); const out = fn(t);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('事务中止'));
    });
  }
  return {
    all: () => tx(['items'],'readonly',t=>t.objectStore('items').getAll()),
    getMeta: k => tx(['meta'],'readonly',t=>t.objectStore('meta').get(k)),
    setMeta: (k,v) => tx(['meta'],'readwrite',t=>{ t.objectStore('meta').put(v,k); }),
    putPhoto: (id, rec) => tx(['photos'],'readwrite',t=>{ t.objectStore('photos').put(rec,id); }),
    getPhoto: async id => fromRec(await tx(['photos'],'readonly',t=>t.objectStore('photos').get(id))),
    getThumb: async id => fromRec(await tx(['thumbs'],'readonly',t=>t.objectStore('thumbs').get(id))),
    /* newPhotos: [{id, rec}], removedIds: [photoId], thumbRec: rec | null (delete) | undefined (keep) */
    saveItem: (item, newPhotos=[], removedIds=[], thumbRec) => tx(['items','photos','thumbs'],'readwrite',t=>{
      t.objectStore('items').put(item);
      const ps = t.objectStore('photos');
      newPhotos.forEach(p=>ps.put(p.rec, p.id)); removedIds.forEach(id=>ps.delete(id));
      if (thumbRec === null) t.objectStore('thumbs').delete(item.id);
      else if (thumbRec) t.objectStore('thumbs').put(thumbRec, item.id);
    }),
    putItems: list => tx(['items'],'readwrite',t=>{ const st=t.objectStore('items'); list.forEach(i=>st.put(i)); }),
    delItem: item => tx(['items','photos','thumbs'],'readwrite',t=>{
      t.objectStore('items').delete(item.id); t.objectStore('thumbs').delete(item.id);
      (item.photoIds||[]).forEach(id=>t.objectStore('photos').delete(id));
    }),
  };
})();
const toRec = async blob => ({type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer()});
const fromRec = r => r && r.buf ? new Blob([r.buf], {type: r.type || 'image/jpeg'}) : null;

/* ================= state ================= */
const CUR = {CNY:'¥',JPY:'J¥',AUD:'A$',USD:'$',HKD:'HK$',TWD:'NT$',KRW:'₩',EUR:'€',GBP:'£'};
let items = [];
let tagOrder = [];
let hiddenTags = [];  // tags not offered when adding/editing an item (meta 'hiddenTags'); items keep them
let tagEdit = false;   // user-chosen order of tags (meta 'tagOrder')
const today = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const pad = n => String(n).padStart(2,'0');
const S = { tab:'cabinet', seg:'collect', cat:'全部', sort:'recent', view:'list', q:'', searching:false,
  month: today().slice(0,7), lf:'all', showTotal:false };
try { Object.assign(S, JSON.parse(localStorage.getItem('kitty-ui')||'{}'), {q:'',searching:false}); } catch(e){}
function saveUI(){ try{ localStorage.setItem('kitty-ui', JSON.stringify({view:S.view,sort:S.sort,tab:S.tab})); }catch(e){} }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (v,cur='CNY') => (CUR[cur]||cur+' ') + (Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const money2 = (v,cur='CNY') => (CUR[cur]||cur+' ') + v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtDate = d => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/,(_,y,m,dd)=>`${y}.${m}.${dd}`) : '';
function toast(msg, ms=1800){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
const isNum = v => typeof v==='number' && isFinite(v);
const isPhoto = p => typeof p==='string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(p);
const isDate = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const isId = v => typeof v==='string' && /^[a-z0-9]{6,40}$/.test(v);
function sanitize(it){
  if (!it || typeof it!=='object') return null;
  const str = (v,n=500) => typeof v==='string' ? v.slice(0,n) : '';
  return {
    id: isId(it.id) ? it.id : uid(),
    name: str(it.name,200), status: it.status==='sold'?'sold':'collect',
    tags: Array.isArray(it.tags) ? [...new Set(it.tags.filter(t=>typeof t==='string'&&t.trim()).map(t=>t.trim().slice(0,40)))] : [],
    buyDate: isDate(it.buyDate)?it.buyDate:'', sellDate: isDate(it.sellDate)?it.sellDate:'',
    currency: CUR[it.currency] ? it.currency : 'CNY',
    buyPrice: isNum(it.buyPrice)?it.buyPrice:null, sellPrice: isNum(it.sellPrice)?it.sellPrice:null,
    note: str(it.note,5000), photoIds: Array.isArray(it.photoIds) ? it.photoIds.filter(isId) : [],
    createdAt: isNum(it.createdAt)?it.createdAt:Date.now(), updatedAt: isNum(it.updatedAt)?it.updatedAt:Date.now(),
  };
}
function dataURLtoBlob(u){
  const [h,b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a], {type: h.slice(5).split(';')[0]});
}
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });

/* resize any image Blob/File to a JPEG Blob */
function resizeToBlob(src, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(src); const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*r)); c.height=Math.max(1,Math.round(img.naturalHeight*r));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('图片处理失败')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('无法读取图片')); };
    img.src = url;
  });
}
const PHOTO_MAX = 1024, PHOTO_Q = 0.72, PHOTO_VER = 2;   // 够看即可, 约 100–150KB/张
const makePhoto = f => resizeToBlob(f, PHOTO_MAX, PHOTO_Q);
const makeThumb = b => resizeToBlob(b, 360, 0.75);

/* convert an item that still carries inline dataURL photos (old version / backup file) */
async function ingest(raw, oldPhotoIds=[]){
  const item = sanitize(raw); if (!item) return null;
  const legacy = Array.isArray(raw.photos) ? raw.photos.filter(isPhoto) : null;
  if (!legacy) { await DB.saveItem(item); return item; }
  const newPhotos=[]; let thumb=null;
  for (const u of legacy){
    const blob = dataURLtoBlob(u); const id = uid();
    newPhotos.push({id, rec: await toRec(blob)});
    if (!thumb) { try { thumb = await toRec(await makeThumb(blob)); } catch(e){} }
  }
  item.photoIds = newPhotos.map(p=>p.id);
  await DB.saveItem(item, newPhotos, oldPhotoIds.filter(id=>!item.photoIds.includes(id)), thumb);
  return item;
}

/* ================= thumbnails: lazy, cached (LRU) ================= */
const TH = { cache:new Map(), inflight:new Map(), MAX:400 };
function thumbURL(id, v){
  const key = id+':'+v;
  if (TH.cache.has(key)) { const u=TH.cache.get(key); TH.cache.delete(key); TH.cache.set(key,u); return Promise.resolve(u); }
  if (TH.inflight.has(key)) return TH.inflight.get(key);
  const p = DB.getThumb(id).then(b=>{
    TH.inflight.delete(key); if (!b) return null;
    const u = URL.createObjectURL(b); TH.cache.set(key,u);
    while (TH.cache.size > TH.MAX) { const [k,old]=TH.cache.entries().next().value; TH.cache.delete(k); URL.revokeObjectURL(old); }
    return u;
  }).catch(()=>{ TH.inflight.delete(key); return null; });
  TH.inflight.set(key,p); return p;
}
function applyThumb(el){
  thumbURL(el.dataset.thumb, el.dataset.v).then(u=>{ if (u && el.isConnected) { el.style.backgroundImage=`url("${u}")`; el.innerHTML=''; } });
}
const thumbIO = 'IntersectionObserver' in window ? new IntersectionObserver(es=>{
  es.forEach(e=>{ if (e.isIntersecting) { thumbIO.unobserve(e.target); applyThumb(e.target); } });
},{rootMargin:'400px 0px'}) : null;
function observeThumbs(root){
  root.querySelectorAll('[data-thumb]').forEach(el=>{
    if (TH.cache.has(el.dataset.thumb+':'+el.dataset.v) || !thumbIO) applyThumb(el); else thumbIO.observe(el);
  });
}

/* ---- virtual list: only rows near the viewport exist in the DOM ---- */
const VL = { list:[], box:null, rowH:121, cols:1, range:[-1,-1], raf:0 };
const LIST_ROW = 121, GRID_TEXT = 62, GRID_GAP = 12, OVERSCAN = 5;
function vlMount(){
  VL.box = $('#vlist'); VL.range=[-1,-1];
  if (!VL.box) return;
  vlMeasure(); vlUpdate();
}
function vlMeasure(){
  const w = VL.box.clientWidth;
  if (S.view==='grid'){ VL.cols=2; VL.rowH = Math.round((w-GRID_GAP)/2 + GRID_TEXT + GRID_GAP); }
  else { VL.cols=1; VL.rowH = LIST_ROW; }
  VL.box.style.height = Math.ceil(VL.list.length/VL.cols)*VL.rowH + 'px';
}
function vlUpdate(){
  if (!VL.box || !VL.box.isConnected) return;
  const top = VL.box.getBoundingClientRect().top + window.scrollY;
  const rows = Math.ceil(VL.list.length/VL.cols);
  const first = Math.max(0, Math.floor((window.scrollY-top)/VL.rowH) - OVERSCAN);
  const last = Math.min(rows-1, Math.floor((window.scrollY+window.innerHeight-top)/VL.rowH) + OVERSCAN);
  if (first===VL.range[0] && last===VL.range[1]) return;
  VL.range=[first,last];
  let h='';
  for (let r=first; r<=last; r++){
    const slice = VL.list.slice(r*VL.cols, (r+1)*VL.cols);
    h += S.view==='grid'
      ? `<div class="vrow g" style="top:${r*VL.rowH}px;height:${VL.rowH-GRID_GAP}px">${slice.map(gridCard).join('')}</div>`
      : `<div class="vrow" style="top:${r*VL.rowH}px">${listCard(slice[0])}</div>`;
  }
  VL.box.innerHTML = h; observeThumbs(VL.box);
}
window.addEventListener('scroll', ()=>{ if (!VL.raf) VL.raf=requestAnimationFrame(()=>{ VL.raf=0; vlUpdate(); }); }, {passive:true});

  if (!el) return;
  const d = el.dataset;
  if (d.act==='settings'){ openSettings(); return; }
  if (d.act==='total'){ S.showTotal=!S.showTotal; render(); return; }
  if (d.act==='search'){ S.searching=!S.searching; if(!S.searching) S.q=''; render(); if(S.searching) $('#q').focus(); return; }
  if (d.view){ S.view=d.view; }
  else if (d.seg){ S.seg=d.seg; window.scrollTo(0,0); }
  else if (d.cat){ S.cat=d.cat; window.scrollTo(0,0); }
  else if (d.lf){ S.lf=d.lf; }
  else if (d.mon){ const [y,m]=S.month.split('-').map(Number); const dt=new Date(y,m-1+Number(d.mon),1); S.month=dt.getFullYear()+'-'+pad(dt.getMonth()+1); }
  else if (d.open){ openEditor(items.find(i=>i.id===d.open)); return; }
  else if (d.del){
    const it = items.find(i=>i.id===d.del); if (!it) return;
    if (!confirm(`删除「${it.name||'未命名'}」？账本中对应的记录也会一并删除。`)) return;
    try { await DB.delItem(it); } catch(err){ alert('删除失败：'+err.message); return; }
    items = items.filter(i=>i.id!==it.id); toast('已删除');
  }
  render();
});
$('#main').addEventListener('input', e=>{
  if (e.target.id==='q'){ if (e.isComposing) return; S.q=e.target.value; refreshList(); }
});
$('#main').addEventListener('compositionend', e=>{
  if (e.target.id==='q'){ S.q=e.target.value; refreshList(); }
});
$('#main').addEventListener('change', e=>{
  if (e.target.id==='sortSel'){ S.sort=e.target.value; render(); }
  if (e.target.id==='monSel' && e.target.value){ S.month=e.target.value; render(); }
});

/* ================= editor =================
   draft.photos: [{id, url, rec?}]  rec present = newly added, not yet saved */
let draft=null, orig=null, isNew=false, dirty=false, busy=false;
async function openEditor(item){
  isNew = !item; dirty=false; orig = item || null; tagEdit = false;
  draft = item ? {...item, tags:[...item.tags], photos:[]} : {
    id:uid(), name:'', status: S.seg==='sold'?'sold':'collect', tags: S.cat!=='全部'?[S.cat]:[],
    buyDate:today(), currency:'CNY', buyPrice:null, sellPrice:null, sellDate:'', note:'', photoIds:[], photos:[], createdAt:Date.now()
  };
  if (item && item.photoIds.length){
    const blobs = await Promise.all(item.photoIds.map(id=>DB.getPhoto(id).catch(()=>null)));
    draft.photos = item.photoIds.map((id,k)=>blobs[k] ? {id, url:URL.createObjectURL(blobs[k])} : null).filter(Boolean);
  }
  renderEditor();
  requestAnimationFrame(()=>$('#sheet').classList.add('open'));
}
function closeEditor(){
  $('#sheet').classList.remove('open');
  const d = draft; draft=null; orig=null;
  setTimeout(()=>{ (d?.photos||[]).forEach(p=>URL.revokeObjectURL(p.url)); if(!draft) $('#sheet').innerHTML=''; }, 350);
}

function row(icColor, icon, label, valHTML){
  return `<div class="row"><span class="ic" style="background:${icColor}">${icon}</span><label>${label}</label><div class="val">${valHTML}</div></div>`;
}
const mi = p => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function renderEditor(){
  const d = draft; const sym = CUR[d.currency]||'';
  const known = allTags().filter(t=>!hiddenTags.includes(t));
  if (!known.length) tagEdit = false;
  $('#sheet').innerHTML = `
  <div class="ebar">
    <button class="circle" id="eBack">${ICON.back}</button>
    <h2>${isNew?'收录新物品':'编辑'}</h2>
    <button class="save" id="eSave">保存</button>
  </div>
  <div class="ebody">
    <div class="photos">
      ${d.photos.map((p,k)=>`<div class="ph" style="background-image:url('${p.url}')"><button class="x" data-rmph="${k}">${ICON.x}</button></div>`).join('')}
      <button class="ph add" id="addPhoto">${ICON.cam}<span>拍照 / 相册</span></button>
    </div>
    <div class="group">
      ${row('#3b82f6', mi('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>'),'名称',`<input id="fName" placeholder="输入名称" value="${esc(d.name)}">`)}
      ${row('#ef5fa7', mi('<path d="M3 9h18M3 15h18"/>'),'当前状态',`<div class="mini-seg"><button data-st="collect" class="${d.status==='collect'?'on':''}">收藏中</button><button data-st="sold" class="${d.status==='sold'?'on':''}">已出售</button></div>`)}
      <div class="row tagrow">
        <div class="top"><span class="ic" style="background:#8b5cf6">${mi('<path d="M7 7h.01M3 3h8l10 10-8 8L3 11z"/>')}</span><label>标签</label>${known.length?`<button class="tedit" id="tagEdit">${tagEdit?'完成':'移除'}</button>`:''}</div>
        ${tagEdit?'<p class="hint" style="margin:0 0 8px;font-size:12px;color:var(--sub)">点标签把它从这里移除（已有物品上的标签不受影响，输入同名标签可重新出现）</p>':''}
        <div class="tagbox">${tagEdit
          ? known.map(t=>`<button class="tag rm" data-tghide="${esc(t)}">${esc(t)} ✕</button>`).join('')
          : known.map(t=>`<button class="tag ${d.tags.includes(t)?'on':''}" data-tg="${esc(t)}">${esc(t)}</button>`).join('')}
          ${d.tags.filter(t=>!known.includes(t)).map(t=>`<button class="tag on" data-tg="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <div class="tagadd"><input id="fTag" placeholder="新标签，如 IP 名 kitty"><button id="addTag">添加</button></div>
      </div>
    </div>
    <div class="group">
      ${row('#f59e0b', mi('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>'),'购买日期',`<input type="date" id="fBuyDate" value="${d.buyDate||''}">`)}
      ${row('#10b981', mi('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),'货币',`<select id="fCur">${Object.keys(CUR).map(k=>`<option value="${k}" ${d.currency===k?'selected':''}>${k} ${CUR[k]}</option>`).join('')}</select>`)}
      ${row('#06b6d4', mi('<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>'),'购买价格',`<input id="fBuy" inputmode="decimal" placeholder="${sym} 点击输入" value="${isNum(d.buyPrice)?d.buyPrice:''}">`)}
      <div id="sellRows" class="${d.status==='sold'?'':'hidden'}">
        ${row('#ef4444', mi('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),'卖出价格',`<input id="fSell" inputmode="decimal" placeholder="${sym} 点击输入" value="${isNum(d.sellPrice)?d.sellPrice:''}">`)}
        ${row('#f97316', mi('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>'),'卖出日期',`<input type="date" id="fSellDate" value="${d.sellDate||''}">`)}
      </div>
    </div>
    <div class="group">
      <div class="row"><span class="ic" style="background:#64748b">${mi('<path d="M4 6h16M4 12h16M4 18h10"/>')}</span><label>备注</label></div>
      <textarea class="note" id="fNote" placeholder="点击添加备注">${esc(d.note)}</textarea>
    </div>
    ${isNew?'':'<button class="dangerbtn" id="eDel">删除此物品</button>'}
  </div>`;
}
function readForm(){
  const num = v => { v=String(v).replace(/[,，\s]/g,''); if(v==='') return null; const n=parseFloat(v); return isNaN(n)?null:n; };
  draft.name = $('#fName').value.trim();
  draft.buyDate = $('#fBuyDate').value;
  draft.currency = $('#fCur').value;
  draft.buyPrice = num($('#fBuy').value);
  draft.sellPrice = num($('#fSell').value);
  draft.sellDate = $('#fSellDate').value;
  draft.note = $('#fNote').value;
}
async function saveDraft(){
  if (!draft.name) draft.name='新物品';
  if (draft.status==='sold' && !draft.sellDate) draft.sellDate=today();
  const ids = draft.photos.map(p=>p.id);
  const oldIds = orig ? orig.photoIds : [];
  const newPhotos = draft.photos.filter(p=>p.rec).map(p=>({id:p.id, rec:p.rec}));
  const removed = oldIds.filter(id=>!ids.includes(id));
  let thumb; // undefined = unchanged
  if (!ids.length) thumb = oldIds.length ? null : undefined;
  else if (ids[0] !== oldIds[0]) {
    const first = draft.photos[0];
    const blob = first.rec ? fromRec(first.rec) : await DB.getPhoto(first.id);
    thumb = blob ? await toRec(await makeThumb(blob)) : null;
  }
  const {photos, ...rest} = draft;
  const item = sanitize({...rest, photoIds: ids, updatedAt: Date.now()});
  await DB.saveItem(item, newPhotos, removed, thumb);
  const k=items.findIndex(i=>i.id===item.id); if(k>=0) items[k]=item; else items.push(item);
  return item;
}
const sheet = $('#sheet');
sheet.addEventListener('input', ()=>{ dirty=true; });
sheet.addEventListener('change', e=>{ if(e.target.id==='fCur'){ readForm(); renderEditor(); } });
sheet.addEventListener('click', async e=>{
  const el = e.target.closest('button'); if(!el || !draft || busy) return;
  if (el.id==='eBack'){ if (dirty && !confirm('放弃未保存的修改？')) return; closeEditor(); return; }
  if (el.id==='addPhoto'){ $('#filePhoto').click(); return; }
  readForm();
  if (el.dataset.rmph!==undefined){ const [p]=draft.photos.splice(+el.dataset.rmph,1); if(p) URL.revokeObjectURL(p.url); dirty=true; }
  else if (el.dataset.st){ draft.status=el.dataset.st; if(draft.status==='sold' && !draft.sellDate) draft.sellDate=today(); dirty=true; }
  else if (el.dataset.tg){ const t=el.dataset.tg; draft.tags = draft.tags.includes(t)? draft.tags.filter(x=>x!==t) : [...draft.tags,t]; dirty=true; }
  else if (el.id==='addTag'){ const v=$('#fTag').value.trim(); if(v && !draft.tags.includes(v)) draft.tags.push(v); if(v) unhideTag(v); dirty=true; }
  else if (el.id==='tagEdit'){ tagEdit=!tagEdit; }
  else if (el.dataset.tghide){ await setHidden(el.dataset.tghide, true); }
  else if (el.id==='eDel'){
    if (!confirm(`删除「${draft.name||'未命名'}」？`)) return;
    try { await DB.delItem(orig); } catch(err){ alert('删除失败：'+err.message); return; }
    items=items.filter(i=>i.id!==orig.id); closeEditor(); render(); toast('已删除'); return;
  }
  else if (el.id==='eSave'){
    busy=true; el.textContent='保存中…';
    try { const it = await saveDraft(); S.seg = it.status; closeEditor(); render(); toast('已保存'); }
    catch(err){ alert('保存失败：'+err.message); el.textContent='保存'; }
    finally { busy=false; }
    return;
  }
  const y = sheet.scrollTop; renderEditor(); sheet.scrollTop = y;
});
sheet.addEventListener('keydown', e=>{ if(e.target.id==='fTag' && e.key==='Enter'){ e.preventDefault(); $('#addTag').click(); } });

/* photo: one input → iOS offers 拍照 / 照片图库 / 选取文件 */
$('#filePhoto').addEventListener('change', async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length||!draft) return;
  readForm(); busy=true; toast('处理照片中…', 10000);
  for (const f of files){
    try { const b = await makePhoto(f); draft.photos.push({id:uid(), url:URL.createObjectURL(b), rec: await toRec(b)}); }
    catch(err){ toast(err.message); }
  }
  busy=false; toast('已添加 '+files.length+' 张');
  dirty=true; const y=sheet.scrollTop; renderEditor(); sheet.scrollTop=y;
});

/* ================= settings: backup ================= */
function openSettings(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="box">
    <h3>设置</h3>
    <p>数据只保存在这台手机的这个主屏幕 App 里。删除 App 图标或清除 Safari 网站数据会丢失全部记录，请定期导出备份（备份文件内含全部照片）。</p>
    <div class="mbtns">
      <button class="pk" data-m="export">导出备份（共 ${items.length} 件）</button>
      <button data-m="import">从备份恢复</button>
      <button data-m="tags">管理标签</button>
      <button data-m="close">关闭</button>
    </div></div>`;
  m.addEventListener('click', async e=>{
    if (e.target===m) return m.remove();
    const b=e.target.closest('[data-m]'); if(!b) return;
    if (b.dataset.m==='close') m.remove();
    if (b.dataset.m==='export') exportData(b);
    if (b.dataset.m==='import') $('#fileImport').click();
    if (b.dataset.m==='tags'){ m.remove(); openTagManager(); }
  });
  document.body.appendChild(m);
}

/* ================= settings: tags (order / delete) ================= */
function openTagManager(){
  const m=document.createElement('div'); m.className='modal';
  const draw = () => {
    const tags = allTags();
    const cnt = t => items.filter(i=>(i.tags||[]).includes(t)).length;
    m.innerHTML = `<div class="box">
      <h3>管理标签</h3>
      <p>按住左边的 ≡ 上下拖动，调整主界面和新增物品时的标签顺序。删除标签只会把它从物品上去掉，物品本身不会删除。</p>
      <div class="tmlist">${tags.length ? tags.map((t,k)=>`<div class="tmrow">
        <span class="grip" aria-label="拖动排序"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></span>
        <div class="tn">${esc(t)}<small>${cnt(t)} 件</small>${hiddenTags.includes(t)?'<small class="hid">新增时不显示</small>':''}</div>
        ${hiddenTags.includes(t)?`<button class="show" data-tshow="${k}">恢复</button>`:''}
        <button class="del" data-tdel="${k}">删除</button>
      </div>`).join('') : '<div class="tmempty">还没有标签。在新增物品时输入标签后，会出现在这里。</div>'}</div>
      <div class="mbtns"><button class="pk" data-m="close">完成</button></div></div>`;
  };
  m.addEventListener('click', async e=>{
    if (e.target===m) return m.remove();
    const b=e.target.closest('button'); if(!b || b.disabled) return;
    if (b.dataset.m==='close') return m.remove();
    const tags = allTags();
    try {
      if (b.dataset.tshow!==undefined){ await setHidden(tags[+b.dataset.tshow], false); }
      else if (b.dataset.tdel!==undefined){
        const t = tags[+b.dataset.tdel]; if (t===undefined) return;
        const used = items.filter(i=>(i.tags||[]).includes(t));
        if (!confirm(`删除标签「${t}」？\n${used.length} 件物品会去掉这个标签，物品本身不会删除。`)) return;
        const changed = used.map(i=>({...i, tags:i.tags.filter(x=>x!==t)}));
        await DB.putItems(changed);
        const byId = new Map(changed.map(i=>[i.id,i])); items = items.map(i=>byId.get(i.id)||i);
        tagOrder = tagOrder.filter(x=>x!==t); await DB.setMeta('tagOrder', tagOrder);
        if (hiddenTags.includes(t)) await setHidden(t, false);
        if (S.cat===t) S.cat='全部';
        toast('已删除标签');
      } else return;
    } catch(err){ alert('操作失败：'+err.message); return; }
    const y = m.querySelector('.tmlist')?.scrollTop || 0;
    draw(); render(); const l=m.querySelector('.tmlist'); if (l) l.scrollTop=y;
  });
  /* drag to reorder: press the ≡ handle and move up/down */
  m.addEventListener('touchstart', e=>{ if (e.target.closest('.grip')) e.preventDefault(); }, {passive:false});
  m.addEventListener('pointerdown', e=>{
    const g = e.target.closest('.grip'); if (!g) return;
    e.preventDefault();
    const list = m.querySelector('.tmlist'), row = g.closest('.tmrow'), rows = [...list.children];
    const from = rows.indexOf(row), h = row.offsetHeight, y0 = e.clientY, s0 = list.scrollTop;
    let to = from, lastY = y0, timer = 0;
    row.classList.add('drag'); try { g.setPointerCapture(e.pointerId); } catch(_){}
    const layout = () => {
      const dy = lastY - y0 + (list.scrollTop - s0);
      row.style.transform = `translateY(${dy}px)`;
      to = Math.max(0, Math.min(rows.length-1, from + Math.round(dy/h)));
      rows.forEach((r,i)=>{ if (r===row) return;
        const sh = (from<to && i>from && i<=to) ? -h : (from>to && i<from && i>=to) ? h : 0;
        r.style.transform = sh ? `translateY(${sh}px)` : ''; });
    };
    const edge = () => {   // auto-scroll when dragging near the top / bottom of a long list
      const b = list.getBoundingClientRect();
      const v = lastY < b.top+40 ? -8 : lastY > b.bottom-40 ? 8 : 0;
      if (v) { list.scrollTop += v; layout(); }
      timer = requestAnimationFrame(edge);
    };
    timer = requestAnimationFrame(edge);
    const move = ev => { lastY = ev.clientY; layout(); };
    const end = async () => {
      cancelAnimationFrame(timer);
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', end); g.removeEventListener('pointercancel', end);
      if (to === from){ rows.forEach(r=>r.style.transform=''); row.classList.remove('drag'); return; }
      const tags = allTags(); const [t] = tags.splice(from,1); tags.splice(to,0,t);
      tagOrder = tags;
      const y = list.scrollTop; draw(); render(); const l = m.querySelector('.tmlist'); if (l) l.scrollTop = y;
      try { await DB.setMeta('tagOrder', tagOrder); } catch(err){ alert('保存顺序失败：'+err.message); }
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  });
  draw(); document.body.appendChild(m);
}
/* backup format unchanged: one JSON, photos inline as dataURLs (old backups stay compatible) */
async function exportData(btn){
  const label = btn.textContent; btn.disabled = true;
  try {
    const parts = [`{"app":"kitty-ledger","version":1,"exportedAt":${JSON.stringify(new Date().toISOString())},"tagOrder":${JSON.stringify(allTags())},"hiddenTags":${JSON.stringify(hiddenTags)},"items":[`];
    for (let k=0; k<items.length; k++){
      const it = items[k]; btn.textContent = `正在打包 ${k+1}/${items.length}…`;
      const photos = [];
      for (const id of it.photoIds){ const b = await DB.getPhoto(id); if (b) photos.push(await blobToDataURL(b)); }
      const {photoIds, ...rest} = it;
      parts.push((k?',':'') + JSON.stringify({...rest, photos}));
    }
    parts.push(']}');
    const name = `收藏备份-${today()}.json`;
    const file = new File(parts, name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:name}); return; } catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  } catch(err){ alert('导出失败：'+err.message); }
  finally { btn.textContent = label; btn.disabled = false; }
}
$('#fileImport').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(!Array.isArray(d.items)) throw new Error('不是有效的备份文件');
    if(!confirm(`备份中有 ${d.items.length} 件物品。同 ID 的会被覆盖，其余保留。继续？`)) return;
    let n=0;
    for (const raw of d.items){
      const old = items.find(i=>i.id===raw?.id);
      const it = await ingest({...raw, photos: Array.isArray(raw?.photos)?raw.photos:[]}, old?old.photoIds:[]);
      if (it) n++;
      if (n%10===0) toast(`正在恢复 ${n}/${d.items.length}…`, 10000);
    }
    items = (await DB.all()).map(sanitize).filter(Boolean);
    if (Array.isArray(d.hiddenTags)){ hiddenTags = cleanOrder(d.hiddenTags); await DB.setMeta('hiddenTags', hiddenTags); }
    if (Array.isArray(d.tagOrder)){ tagOrder = cleanOrder(d.tagOrder); await DB.setMeta('tagOrder', tagOrder); }
    document.querySelector('.modal')?.remove(); render(); toast(`已恢复 ${n} 件`);
  }catch(err){ alert('恢复失败：'+err.message); }
});

/* one-time: re-encode photos saved at the old, larger size */
async function shrinkOldPhotos(){
  if ((await DB.getMeta('photoVer')) >= PHOTO_VER) return;
  const ids = items.flatMap(i=>i.photoIds);
  let k=0, saved=0;
  for (const id of ids){
    k++; if (k%5===0) toast(`正在压缩旧照片 ${k}/${ids.length}…`, 60000);
    try {
      const b = await DB.getPhoto(id); if (!b || b.size < 160*1024) continue;
      const nb = await resizeToBlob(b, PHOTO_MAX, PHOTO_Q);
      if (nb.size < b.size) { await DB.putPhoto(id, await toRec(nb)); saved += b.size-nb.size; }
    } catch(e){}
  }
  await DB.setMeta('photoVer', PHOTO_VER);
  if (saved > 1024*1024) toast(`照片压缩完成，节省 ${Math.round(saved/1024/1024)}MB`);
}

/* ================= boot ================= */
(async ()=>{
  try {
    const raw = await DB.all();
    const legacy = raw.filter(r=>Array.isArray(r.photos));   // saved by the first version: photos inline
    if (legacy.length){
      toast(`正在升级数据 0/${legacy.length}…`, 60000);
      let k=0; for (const r of legacy){ await ingest(r); toast(`正在升级数据 ${++k}/${legacy.length}…`, 60000); }
      toast('数据升级完成');
    }
    items = (legacy.length ? await DB.all() : raw).map(sanitize).filter(Boolean);
    tagOrder = cleanOrder(await DB.getMeta('tagOrder'));
    hiddenTags = cleanOrder(await DB.getMeta('hiddenTags'));
    await shrinkOldPhotos();
  }
  catch(e){ alert('本地数据库打开失败：'+e.message); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  render();
  if ('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
